name: Skills installation
on: [push, pull_request, workflow_dispatch]
jobs:
  install:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - run: bun install --frozen-lockfile
      - run: bun run test
  test-conflicts:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"
      - uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.46.0,mergiraf@0.20.0
      - run: bun run test:conflicts
  test-analysis:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: taiki-e/install-action@v2
        with:
          tool: jj-cli@0.46.0,nu@0.114.1
      - run: python -B -m unittest discover -s tests -p test_restack_analysis.py -v
      - run: python -m pip install mypy==2.3.1
      - run: python -m mypy --strict --python-version 3.11 skills/jj-clean-restack/scripts/hunk_lineage.py tests/test_restack_analysis.py
        env:
          MYPYPATH: skills/jj-clean-restack/scripts
